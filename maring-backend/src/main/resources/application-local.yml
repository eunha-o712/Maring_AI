# Opt-in local development storage. Run from maring-backend so ./data is stable.
# This profile is for one local developer process, not a production database.
spring:
  datasource:
    url: jdbc:h2:file:./data/maring;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
